<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay cycle calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky picker, a note on the chosen option with live counts (rows, cycle days visible), then the
   Calendar page mock: its header with ‹ › and the Month / Pay cycle switch, the grid, and a slim side panel.
   Tokens mirror src/styles/globals.css (dark is the app default, light mirrors .light-mode). */
:root {
  --page: #050506; --bg: #09090b; --card: #18181b; --card-2: #1f1f23; --line: #3f3f46; --line-soft: #2a2a2f;
  --fg: #f4f4f5; --muted: #a1a1aa; --faint: #71717a; --chip-on: #18181b;
  --primary: #3b82f6; --primary-text: #60a5fa; --primary-soft: rgba(59,130,246,.15);
  --income: #34d399; --danger: #f87171; --warn: #f59e0b; --today: #38bdf8; --heat: 59,130,246;
  --tint-a: rgba(59,130,246,.13); --tint-b: rgba(161,161,170,.04);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
[data-theme="light"] {
  --page: #e4e4e7; --bg: #f4f4f5; --card: #ffffff; --card-2: #f4f4f6; --line: #e2e8f0; --line-soft: #ececf0;
  --fg: #0f172a; --muted: #64748b; --faint: #94a3b8; --chip-on: #ffffff;
  --primary: #2563eb; --primary-text: #2563eb; --primary-soft: rgba(37,99,235,.1);
  --income: #059669; --danger: #dc2626; --warn: #d97706; --today: #1d4ed8; --heat: 37,99,235;
  --tint-a: rgba(37,99,235,.09); --tint-b: rgba(100,116,139,.04);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 var(--font); background: var(--page); color: var(--fg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--page); }
.bar-top .gut { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; padding: 2px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); }
.seg button { padding: 3px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--primary); color: #fff; }
.info { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(220px, auto); gap: 10px 28px; padding-block: 16px 14px; align-items: start; }
.info h1 { margin: 0 0 2px; font-size: 18px; letter-spacing: -.01em; }
.info p { margin: 0; color: var(--muted); font-size: 13px; }
.info b.k { display: block; color: var(--fg); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
.stats { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.ok { color: var(--income); } .bad { color: var(--danger); }
@media (max-width: 900px) { .info { grid-template-columns: 1fr; } }

/* app stage */
.stage-wrap { padding-bottom: 32px; }
.stage { container: app / inline-size; height: max(700px, calc(100vh - 170px)); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 14px; overflow: hidden; margin: 0 auto; max-width: 100%; transition: max-width .25s ease; }
body.phone .stage { max-width: 390px; height: 780px; }
.apphead { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line-soft); background: var(--card); flex-wrap: wrap; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav button { width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: 16px; }
.nav button:hover { background: var(--card-2); color: var(--fg); }
.ptitle { font-size: 16px; font-weight: 650; min-width: 0; }
.ptitle small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.basis { display: inline-flex; padding: 2px; border-radius: 999px; background: color-mix(in srgb, var(--muted) 14%, transparent); margin-left: auto; }
.basis button { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); }
.basis button[aria-pressed="true"] { background: var(--chip-on); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.outside-ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 12px; padding: 12px 14px 14px; }
.main { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.warn { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px; background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); font-size: 12.5px; font-weight: 500; }
.warn b { font-weight: 700; }

.wdays { display: grid; grid-template-columns: 26px repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: var(--muted); text-align: center; }
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 26px repeat(7, minmax(0, 1fr)); gap: 6px; }
.grid.scroll { overflow-y: auto; grid-auto-rows: 118px; align-content: start; scroll-behavior: smooth; padding-right: 2px; }
.wk { display: grid; place-items: center; font-size: 11px; color: var(--faint); background: var(--card); border-radius: 8px; }
.cell { position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 5px; padding: 7px 9px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--card); transition: opacity .2s; }
.cell .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.cell .dn { font-size: 15px; font-weight: 600; }
.cell .dn small { font-size: 10px; color: var(--primary-text); font-weight: 700; margin-right: 3px; }
.cell .tot { font-weight: 650; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell .tot.pl { color: var(--primary-text); font-style: italic; }
.cell .its { display: grid; gap: 1px; font-size: 11px; overflow: hidden; }
.cell .its div { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); }
.cell .its div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .its div span:last-child { color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell .its div.pl { border-bottom: 1px dashed color-mix(in srgb, var(--primary) 45%, transparent); }
.cell .its div.pl span:last-child { color: var(--primary-text); }
.cell .sample { position: absolute; right: 6px; bottom: 4px; font-size: 9.5px; color: var(--faint); }
.cell.today { border: 2px solid var(--today); }
.cell.cstart { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--income) 70%, transparent); }
.cell.cend { box-shadow: inset -3px 0 0 color-mix(in srgb, var(--warn) 60%, transparent); }
.cell.cstart.cend { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--income) 70%, transparent), inset -3px 0 0 color-mix(in srgb, var(--warn) 60%, transparent); }
.cell.out { opacity: .32; }
.cell.out .its, .cell.out .tot { visibility: hidden; }
.cell.gone { visibility: hidden; }
.cell.tint-a { background: linear-gradient(var(--tint-a), var(--tint-a)), var(--card); }
.cell.tint-b { background: linear-gradient(var(--tint-b), var(--tint-b)), var(--card); }
.cell .pill { align-self: flex-start; font-size: 10.5px; font-weight: 600; color: var(--income); background: color-mix(in srgb, var(--income) 14%, transparent); border-radius: 999px; padding: 0 7px; white-space: nowrap; }

.side { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; min-height: 0; overflow: auto; }
.side .eb { color: var(--muted); }
.side .eb b { color: var(--fg); font-weight: 500; }
.side .val { font-size: 24px; font-weight: 700; color: var(--primary-text); letter-spacing: -.02em; line-height: 1.1; }
.side .rows div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); }
.side .rows div b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.side .match { padding: 8px 10px; border-radius: 8px; font-size: 12px; }
.side .match.ok { background: color-mix(in srgb, var(--income) 12%, transparent); }
.side .match.bad { background: color-mix(in srgb, var(--danger) 12%, transparent); }

@container app (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }
@container app (max-width: 700px) {
  .wdays, .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .wdays .w0, .wk { display: none; }
  .grid.scroll { grid-auto-rows: 64px; }
  .cell { padding: 4px 3px; gap: 1px; border-radius: 6px; align-items: center; }
  .cell .hd { flex-direction: column; align-items: center; gap: 0; }
  .cell .dn { font-size: 12px; } .cell .dn small { display: none; }
  .cell .tot { font-size: 9.5px; } .cell .its, .cell .sample { display: none; }
  .cell .pill { font-size: 8px; padding: 0 3px; }
  .cell.cstart { box-shadow: inset 2px 0 0 color-mix(in srgb, var(--income) 70%, transparent); }
  .ptitle { font-size: 14px; }
  .outside-ctl span { display: none; }
}
</style>
</head>
<body>

<div class="bar-top">
  <div class="gut">
    <div class="ctl">Option <div class="seg" id="ctl-opt" role="group" aria-label="Fix option"></div></div>
    <div class="ctl">Width
      <div class="seg" role="group" aria-label="Preview width">
        <button type="button" data-action="device" data-v="desk" aria-pressed="true">Desktop</button>
        <button type="button" data-action="device" data-v="phone" aria-pressed="false">Phone</button>
      </div>
    </div>
    <div class="ctl">Theme
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-action="theme" data-v="dark" aria-pressed="true">Dark</button>
        <button type="button" data-action="theme" data-v="light" aria-pressed="false">Light</button>
      </div>
    </div>
  </div>
</div>

<section class="gut info" aria-live="polite">
  <div><h1 id="i-name"></h1><p id="i-idea"></p></div>
  <div><b class="k">Why</b><p id="i-why"></p></div>
  <div><b class="k">Trade-off</b><p id="i-trade"></p></div>
  <div class="stats" id="i-stats"></div>
</section>

<div class="gut stage-wrap"><div class="stage" id="stage"></div></div>

<script>
(() => {
  /* ---------- dates as day numbers (days since 1970-01-01, UTC) ---------- */
  const dn = (y, m, d) => Date.UTC(y, m - 1, d) / 864e5;
  const parts = n => { const t = new Date(n * 864e5); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), wd: (t.getUTCDay() + 6) % 7 }; };
  const monday = n => n - parts(n).wd;
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const lab = n => { const p = parts(n); return `${p.d} ${MON[p.m - 1]}`; };
  const TODAY = dn(2026, 11, 7);
  const START_DAY = 5; // pay cycle starts on the 5th, like yours

  const cycleOf = n => {
    let { y, m, d } = parts(n);
    if (d < START_DAY) { m -= 1; if (m === 0) { m = 12; y -= 1; } }
    return { start: dn(y, m, START_DAY), end: dn(y, m + 1, START_DAY) - 1 };
  };
  const monthOf = n => { const { y, m } = parts(n); return { start: dn(y, m, 1), end: dn(y, m + 1, 1) - 1 }; };
  const periodOf = n => state.basis === 'cycle' ? cycleOf(n) : monthOf(n);
  // The day a month stands for (same rule as the fix in src/lib/periods.ts monthAnchor).
  const monthAnchor = month => {
    if (month.start <= TODAY && TODAY <= month.end) return TODAY;
    let best = month.start, most = 0;
    for (let day = month.start; day <= month.end;) {
      const p = periodOf(day), s = Math.max(p.start, month.start), e = Math.min(p.end, month.end);
      if (e - s + 1 > most) { most = e - s + 1; best = s; }
      day = p.end + 1;
    }
    return best;
  };
  const range = p => `${lab(p.start)} – ${lab(p.end)} ${parts(p.end).y}`;

  /* ---------- spending: your days from the screenshot, plans after today, sample data before 26 Oct ---------- */
  const REAL = {
    '10-26': [['Taxi về trọ', 110000]], '10-27': [['Mua gạo', 119000]], '10-28': [], '10-29': [['Ăn trưa', 35000]],
    '10-30': [['Ăn trưa', 35000], ['Breakfast', 15000]],
    '10-31': [['Phở khô gia lai', 84000], ['Xăng', 75000], ['Bánh cún Q10', 51000], ['Highland', 49000], ['Nạp 4G', 22000]],
    '11-1': [['4G', 50000]], '11-2': [['Gửi xe RK', 230000]], '11-3': [], '11-4': [['4G', 50000], ['Xôi', 15000], ['Breakfast', 15000]],
    '11-5': [['Ba đi đám cưới', 1500000], ['Hủ tíu mì bò kho', 45000], ['Lunch', 35000], ['Be về nhà', 19000], ['Breakfast', 15000]],
    '11-6': [['Xôi', 15000]], '11-7': [['Tiền trọ', 3000000], ['Cho mẹ', 3000000], ['Claude', 555000]],
  };
  const TOTALS = { '11-5': 1627000 };
  const PLAN = [[['Breakfast', 15000], ['Lunch', 35000]], [['Breakfast', 15000], ['Lunch', 35000]], [['Breakfast', 15000], ['Fuel', 80000], ['Lunch', 35000]], [['Breakfast', 15000], ['Lunch', 35000]], [['Breakfast', 15000], ['Lunch', 35000]], [], []];
  const POOL = [['Breakfast', 15000], ['Lunch', 35000], ['Xăng', 75000], ['Highland', 49000], ['Grab', 62000], ['Siêu thị', 240000]];
  function dayData(n) {
    const p = parts(n), key = `${p.m}-${p.d}`;
    if (p.y === 2026 && REAL[key]) { const items = REAL[key]; return { items, total: TOTALS[key] || items.reduce((s, i) => s + i[1], 0) }; }
    if (n > TODAY) { const items = n === TODAY + 1 ? [] : PLAN[p.wd]; return { items, planned: true, total: items.reduce((s, i) => s + i[1], 0) }; }
    let r = (n * 9301 + 49297) % 233280;
    const items = [];
    if (p.d === 7) items.push(['Tiền trọ', 3000000], ['Cho mẹ', 3000000]);
    const count = r % 3;
    for (let k = 0; k < count; k++) { r = (r * 9301 + 49297) % 233280; items.push(POOL[r % POOL.length]); }
    return { items, sample: true, total: items.reduce((s, i) => s + i[1], 0) };
  }
  const fmt = n => Math.round(n).toLocaleString('vi-VN');
  const short = n => n >= 1e6 ? (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);

  /* ---------- options ---------- */
  const OPTS = {
    now: {
      tab: 'Current', name: 'Current behaviour', idea: 'Every page is a calendar month, always 5 weeks from the week of the 1st.',
      why: 'Shown for comparison: the bug.',
      trade: 'In Pay cycle mode the cycle’s last days (30 Nov – 4 Dec) sit on the next page while the side panel still counts them. Month mode loses days too when a month starts late in the week (31 Aug 2026).',
      paging: 'month',
    },
    a: {
      tab: 'A Cycle pages', name: 'A · One page per pay cycle', idea: 'In Pay cycle mode each page is one cycle: from the week it starts to the week it ends, 5 or 6 rows. Days outside the cycle are faded or hidden.',
      why: 'The page and the side panel always cover the same days, so the totals match what you see. ‹ › and swipe move one cycle. Month mode gets the same rule (5 or 6 rows), which also fixes 31 Aug.',
      trade: 'Cycles that span 6 weeks get slightly shorter rows. Neighbouring days are only context, not part of the page.',
      paging: 'period',
    },
    b: {
      tab: 'B Stretching months', name: 'B · Month pages that stretch', idea: 'Pages stay calendar months. In Pay cycle mode a page adds the rows needed to show the whole cycle that month stands for.',
      why: 'Smallest change: navigation and swiping stay by month, only the row count changes. Days outside the cycle are faded.',
      trade: 'Often 6 rows, so cells are shorter, and the faded days of the neighbouring cycle still take space.',
      paging: 'month',
    },
    c: {
      tab: 'C Continuous weeks', name: 'C · Continuous weeks', idea: 'No pages: weeks scroll up and down, each pay cycle is tinted, its first day is labelled, and the header names the cycle in view.',
      why: 'A cycle is never cut, whatever its length (works for weekly or twice-monthly pay too). ‹ › jumps to the previous or next cycle.',
      trade: 'The biggest change. Rows have a fixed height, so a whole cycle may need scrolling on short screens, and the swipe-by-month gesture goes away.',
      paging: 'scroll',
    },
  };
  const state = { opt: 'a', basis: 'cycle', anchor: TODAY, outside: 'dim' };
  try { const saved = localStorage.getItem('pc-cal-opt'); if (saved && OPTS[saved]) state.opt = saved; } catch (e) {}

  /* ---------- page model ---------- */
  function pageModel() {
    const o = OPTS[state.opt];
    const month = monthOf(state.anchor);
    const period = o.paging === 'month' ? periodOf(monthAnchor(month)) : periodOf(state.anchor);
    let first, weeks, title, sub;
    if (state.opt === 'now') { first = monday(month.start); weeks = 5; }
    else if (state.opt === 'a') { first = monday(period.start); weeks = (monday(period.end) - first) / 7 + 1; }
    else if (state.opt === 'b') {
      const s = Math.min(month.start, period.start), e = Math.max(month.end, period.end);
      first = monday(s); weeks = (monday(e) - first) / 7 + 1;
    }
    if (o.paging === 'month') { const p = parts(month.start); title = `${MONL[p.m - 1]} ${p.y}`; sub = state.basis === 'cycle' ? `Pay cycle ${range(period)}` : 'Calendar month'; }
    else { title = range(period); sub = state.basis === 'cycle' ? 'Pay cycle' : 'Calendar month'; }
    return { o, month, period, first, weeks, title, sub };
  }

  function cellHTML(n, cls, opts = {}) {
    const p = parts(n), data = dayData(n), c = cycleOf(n);
    const classes = ['cell', cls, n === TODAY && 'today', state.basis === 'cycle' && n === c.start && 'cstart', state.basis === 'cycle' && n === c.end && 'cend'].filter(Boolean).join(' ');
    const heat = !data.planned && data.total && !cls ? `background:color-mix(in srgb, rgb(var(--heat)) ${Math.round(Math.min(.4, .07 + Math.log10(data.total / 1e4) * .11) * 100)}%, var(--card))` : '';
    const pill = opts.pill ? `<span class="pill">${opts.pill}</span>` : '';
    return `<div class="${classes}" style="${heat}" title="${lab(n)} ${p.y}">
      <div class="hd"><span class="dn">${p.d === 1 ? `<small>${MON[p.m - 1].toUpperCase()}</small>` : ''}${p.d}</span>${data.total ? `<span class="tot${data.planned ? ' pl' : ''}">${data.planned ? '~' : ''}<span class="fl">${fmt(data.total)} ₫</span></span>` : ''}</div>
      ${pill}
      ${data.items.length ? `<div class="its">${data.items.slice(0, 5).map(i => `<div class="${data.planned ? 'pl' : ''}"><span>${i[0]}</span><span>${data.planned ? '~' : ''}${fmt(i[1])} ₫</span></div>`).join('')}</div>` : ''}
      ${data.sample ? '<span class="sample">sample</span>' : ''}
    </div>`;
  }

  function gridHTML(m) {
    let html = '';
    if (state.opt === 'c') {
      const from = monday(dn(2026, 8, 31)), weeks = 22;
      for (let w = 0; w < weeks; w++) {
        const ws = from + w * 7;
        html += `<div class="wk" data-week="${ws}">${isoWeek(ws)}</div>`;
        for (let k = 0; k < 7; k++) {
          const n = ws + k, per = periodOf(n), p = parts(per.start);
          const tint = ((p.y * 12 + p.m) % 2) ? 'tint-a' : 'tint-b';
          const pill = n === per.start ? (state.basis === 'cycle' ? `▸ ${lab(per.start)} – ${lab(per.end)}` : `▸ ${MONL[p.m - 1]}`) : '';
          html += cellHTML(n, tint, { pill });
        }
      }
      return `<div class="grid scroll" id="grid">${html}</div>`;
    }
    for (let w = 0; w < m.weeks; w++) {
      const ws = m.first + w * 7;
      html += `<div class="wk">${isoWeek(ws)}</div>`;
      for (let k = 0; k < 7; k++) {
        const n = ws + k;
        let cls = '';
        if (state.opt === 'a' && (n < m.period.start || n > m.period.end)) cls = state.outside === 'hide' ? 'gone' : 'out';
        if (state.opt === 'b' && state.basis === 'cycle' && (n < m.period.start || n > m.period.end)) cls = 'out';
        if (state.opt === 'b' && state.basis === 'month' && (n < m.month.start || n > m.month.end)) cls = 'out';
        html += cellHTML(n, cls);
      }
    }
    return `<div class="grid" style="grid-template-rows:repeat(${m.weeks},minmax(0,1fr))">${html}</div>`;
  }
  const isoWeek = n => { const th = n + 3 - parts(n).wd, y = parts(th).y, jan4 = dn(y, 1, 4); return 1 + Math.round((th - (jan4 + 3 - parts(jan4).wd)) / 7); };

  function sideHTML(m, visible) {
    let spent = 0, planned = 0;
    for (let n = m.period.start; n <= m.period.end; n++) { const d = dayData(n); if (d.planned) planned += d.total; else spent += d.total; }
    const total = m.period.end - m.period.start + 1;
    return `<aside class="side" aria-label="Period summary">
      <div class="eb"><b>${state.basis === 'cycle' ? 'Pay cycle' : 'Month'}</b> · ${lab(m.period.start)} – ${lab(m.period.end)}</div>
      <div><div class="eb">Spent + planned</div><div class="val">${fmt(spent + planned)} ₫</div></div>
      <div class="rows"><div>Spent<b>${fmt(spent)} ₫</b></div><div>Planned<b>~${fmt(planned)} ₫</b></div></div>
      ${state.opt === 'c' ? `<div class="match ok">Every day of this ${state.basis === 'cycle' ? 'cycle' : 'month'} is in the scrolling grid.</div>`
        : visible === total ? `<div class="match ok">All ${total} days counted here are on the page.</div>`
        : `<div class="match bad">${total - visible} of the ${total} days counted here are not on this page.</div>`}
    </aside>`;
  }

  function render() {
    const m = pageModel();
    const stage = document.getElementById('stage');
    const lastShown = state.opt === 'c' ? Infinity : m.first + m.weeks * 7 - 1;
    const firstShown = state.opt === 'c' ? -Infinity : m.first;
    const total = m.period.end - m.period.start + 1;
    const visible = Math.max(0, Math.min(m.period.end, lastShown) - Math.max(m.period.start, firstShown) + 1);
    const missing = [];
    if (m.period.start < firstShown) missing.push(`${lab(m.period.start)} – ${lab(firstShown - 1)}`);
    if (m.period.end > lastShown) missing.push(`${lab(lastShown + 1)} – ${lab(m.period.end)}`);

    stage.innerHTML = `<div class="apphead">
        <div class="nav"><button type="button" data-action="prev" aria-label="Previous">‹</button><button type="button" data-action="next" aria-label="Next">›</button></div>
        <div class="ptitle" id="ptitle">${m.title}<small id="psub">${m.sub}</small></div>
        ${state.opt === 'a' ? `<div class="outside-ctl"><span>Days outside</span><div class="basis" style="margin:0" role="group" aria-label="Days outside the cycle">
            <button type="button" data-action="outside" data-v="dim" aria-pressed="${state.outside === 'dim'}">Faded</button>
            <button type="button" data-action="outside" data-v="hide" aria-pressed="${state.outside === 'hide'}">Hidden</button></div></div>` : ''}
        <div class="basis" role="group" aria-label="Calendar shows">
          <button type="button" data-action="basis" data-v="month" aria-pressed="${state.basis === 'month'}">Month</button>
          <button type="button" data-action="basis" data-v="cycle" aria-pressed="${state.basis === 'cycle'}">Pay cycle</button>
        </div>
      </div>
      <div class="body">
        <div class="main">
          ${missing.length ? `<div class="warn" role="note">Not on this page: <b>${missing.join(' and ')}</b> (${total - visible} day${total - visible === 1 ? '' : 's'} of this ${state.basis === 'cycle' ? 'pay cycle' : 'month'})</div>` : ''}
          <div class="wdays"><span class="w0"></span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<span>${d}</span>`).join('')}</div>
          ${gridHTML(m)}
        </div>
        ${sideHTML(m, visible)}
      </div>`;

    const o = m.o;
    document.getElementById('i-name').textContent = o.name;
    document.getElementById('i-idea').textContent = o.idea;
    document.getElementById('i-why').textContent = o.why;
    document.getElementById('i-trade').textContent = o.trade;
    const unit = state.basis === 'cycle' ? 'pay cycle' : 'month';
    document.getElementById('i-stats').innerHTML = state.opt === 'c'
      ? `<span>Rows: <b>scrolling</b>, 118px each</span><span class="ok">Whole ${unit} always reachable</span><span>Try › and ‹ to jump between ${unit}s.</span>`
      : `<span>Rows on this page: <b>${m.weeks}</b></span><span class="${visible === total ? 'ok' : 'bad'}">Days of this ${unit} on the page: <b>${visible} of ${total}</b></span><span>${{ now: 'Try Month: November loses 30 Nov even in Month mode.', a: 'Try › once: 5 Dec – 4 Jan needs 6 weeks.', b: 'The first row is all faded days of the previous cycle.' }[state.opt]}</span>`;
    document.getElementById('ctl-opt').innerHTML = Object.entries(OPTS).map(([k, x]) => `<button type="button" data-action="opt" data-v="${k}" aria-pressed="${state.opt === k}">${x.tab}</button>`).join('');

    if (state.opt === 'c') setupScroll(m);
  }

  /* continuous weeks: scroll to the period, and keep the header naming the period in view */
  function setupScroll(m) {
    const grid = document.getElementById('grid');
    const row = grid.querySelector(`[data-week="${monday(m.period.start)}"]`);
    grid.style.scrollBehavior = 'auto';
    if (row) grid.scrollTop = row.offsetTop - grid.offsetTop;
    grid.style.scrollBehavior = '';
    const rows = [...grid.querySelectorAll('[data-week]')];
    grid.addEventListener('scroll', () => {
      const mid = grid.scrollTop + grid.clientHeight * 0.35;
      const r = rows.find(el => el.offsetTop - grid.offsetTop + el.offsetHeight > mid) || rows[rows.length - 1];
      const day = Number(r.dataset.week) + 3, per = periodOf(day);
      state.anchor = day;
      document.getElementById('ptitle').firstChild.textContent = range(per);
    }, { passive: true });
  }

  function step(dir) {
    const m = pageModel();
    if (m.o.paging === 'month') {
      const p = parts(m.month.start);
      state.anchor = monthAnchor(monthOf(dn(p.y, p.m + dir, 1)));
    } else {
      state.anchor = dir < 0 ? periodOf(m.period.start - 1).start : m.period.end + 1;
      if (state.opt === 'c') {
        const grid = document.getElementById('grid');
        const target = periodOf(state.anchor);
        const row = grid.querySelector(`[data-week="${monday(target.start)}"]`);
        if (row) { grid.scrollTop = row.offsetTop - grid.offsetTop; return; }
      }
    }
    render();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]'); if (!b) return;
    const a = b.dataset.action, v = b.dataset.v;
    if (a === 'opt') { state.opt = v; try { localStorage.setItem('pc-cal-opt', v); } catch (err) {} }
    else if (a === 'basis') { state.basis = v; }
    else if (a === 'outside') state.outside = v;
    else if (a === 'prev') return step(-1);
    else if (a === 'next') return step(1);
    else if (a === 'theme' || a === 'device') {
      b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      if (a === 'theme') { document.documentElement.dataset.theme = v; return; }
      document.body.classList.toggle('phone', v === 'phone'); setTimeout(render, 280); return;
    } else return;
    render();
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  // #a, #b, #c or #now opens an option; add ",next" to start one cycle later (for checking 6-week pages).
  const [h, extra] = location.hash.slice(1).split(',');
  if (OPTS[h]) state.opt = h;
  render();
  if (extra === 'next') step(1);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planned money prototype</title>
<script>
  // The same file renders two things: the outer demo page, and (with ?app) the app itself inside an iframe.
  // The app loads the real stylesheets from src/styles so it looks exactly like MyFinance, and the phone
  // frame simply narrows the iframe so the app's own ≤768px breakpoints take over.
  window.IS_APP = new URLSearchParams(location.search).has('app');
  if (window.IS_APP) {
    for (const f of ['globals', 'navigation', 'CalendarView', 'ExpenseForm', 'QuickEntry', 'Mobile', 'UserProfile']) {
      document.write(`<link rel="stylesheet" href="../../src/styles/${f}.css">`);
    }
  }
</script>
<style id="outer-css">
  .outer { margin: 0; font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: #e9ebef; color: #0f172a; }
  .outer.dark { background: #050506; color: #f4f4f5; }
  .outer .wrap { max-width: 1480px; margin: 0 auto; padding: 0 20px; }
  .outer h1 { font-size: 26px; margin: 22px 0 4px; letter-spacing: -.02em; }
  .outer .lede { color: #64748b; margin: 0 0 10px; max-width: 1000px; }
  .outer .bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, currentColor 0%, #e9ebef 92%); backdrop-filter: blur(8px); border-bottom: 1px solid #d4d4d8; }
  .outer.dark .bar { background: rgba(5,5,6,.9); border-color: #27272a; }
  .outer .bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-top: 9px; padding-bottom: 9px; }
  .outer .ctl { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #64748b; }
  .outer .seg { display: inline-flex; background: #fff; border: 1px solid #d4d4d8; border-radius: 10px; padding: 2px; }
  .outer.dark .seg, .outer.dark .tb, .outer.dark .clock, .outer.dark .tips { background: #18181b; border-color: #3f3f46; color: #f4f4f5; }
  .outer .seg button { border: 0; background: none; font: inherit; padding: 4px 10px; border-radius: 8px; font-weight: 600; color: #64748b; cursor: pointer; }
  .outer .seg button.on { background: #3b82f6; color: #fff; }
  .outer .clock { font-weight: 700; background: #fff; border: 1px solid #d4d4d8; color: #0f172a; padding: 4px 10px; border-radius: 9px; font-variant-numeric: tabular-nums; }
  .outer .tb { font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; cursor: pointer; color: #0f172a; }
  .outer .tb:hover { border-color: #3b82f6; color: #3b82f6; }
  .outer .layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; margin: 16px auto 40px; align-items: start; }
  @media (max-width: 1250px) { .outer .layout { grid-template-columns: 1fr; } }
  .outer .stage { display: flex; justify-content: center; }
  .outer .desk { width: 100%; height: 880px; border-radius: 12px; overflow: hidden; border: 1px solid #d4d4d8; box-shadow: 0 18px 50px rgba(15,23,42,.18); display: flex; flex-direction: column; background: #fff; }
  .outer .desk .chrome { height: 32px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #e4e4e7; }
  .outer.dark .desk { border-color: #27272a; } .outer.dark .desk .chrome { background: #27272a; }
  .outer .desk .chrome i { width: 10px; height: 10px; border-radius: 50%; }
  .outer .desk .chrome span { margin-left: 10px; background: rgba(255,255,255,.7); border-radius: 7px; padding: 1px 12px; font-size: 11.5px; color: #52525b; }
  .outer .phone { width: 410px; height: 864px; border-radius: 52px; border: 10px solid #1f2937; overflow: hidden; box-shadow: 0 18px 50px rgba(15,23,42,.25); background: #000; position: relative; }
  .outer .phone::before { content: ""; position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 96px; height: 26px; background: #000; border-radius: 14px; z-index: 2; }
  .outer iframe { border: 0; width: 100%; flex: 1; display: block; height: 100%; }
  .outer .phone iframe { padding-top: 34px; background: inherit; }
  .outer .tips { background: #fff; border: 1px solid #d4d4d8; border-radius: 16px; padding: 14px 16px; font-size: 13px; position: sticky; top: 62px; }
  .outer .tips h3 { margin: 0 0 6px; font-size: 15px; } .outer .tips ol { margin: 0; padding-left: 18px; } .outer .tips li { margin: 5px 0; }
  .outer .tips p { margin: 10px 0 0; color: #64748b; font-size: 12px; }
</style>
<style id="app-css">
  /* Glue for the new planning pieces. Everything else comes from src/styles. Only app tokens are used. */
  .pp-status { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; font-size: 0.82rem; line-height: 1.4; background: color-mix(in srgb, var(--text-main) 6%, var(--bg-card)); color: var(--text-muted); }
  .pp-status svg { flex: none; margin-top: 1px; }
  .pp-status.is-plan { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--text-main); }
  .pp-status.is-plan svg { color: var(--primary); }
  .pp-status.is-warn { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--text-main); }
  .qe-mode button.is-on[data-mode="plan"] { background: var(--primary); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
  .qe-seg.pp-sure button { display: flex; flex-direction: column; align-items: center; line-height: 1.2; padding: 5px 8px; white-space: normal; }
  .qe-seg.pp-sure button small { font-weight: 500; font-size: 0.7rem; color: var(--text-muted); }
  .pp-plan-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-weight: 600; font-size: 0.8rem; }
  .pp-plan-btn:hover { background: color-mix(in srgb, var(--primary) 20%, transparent); }
  .calendar-spending-row.pp-in .calendar-spending-amount { color: var(--success); }
  .calendar-spending-row-planned.pp-in { border-color: color-mix(in srgb, var(--success) 55%, transparent); }
  .calendar-spending-row-planned.pp-in .calendar-spending-amount { color: var(--success); }
  .calendar-spending-row-planned.pp-sure { border-style: solid; opacity: .85; }
  .day-tx-row.is-planned.pp-sure .day-tx-icon-circle { border-style: solid; }
  .day-tx-amount.is-income { color: var(--success); }
  .day-planned-btns { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 330px; }
  .pp-pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; background: color-mix(in srgb, var(--text-main) 8%, transparent); color: var(--text-muted); }
  .pp-pill.is-sure { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); }
  .pp-pill.is-in { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }
  .user-profile .pp-group { margin: 6px 0 -6px; display: flex; align-items: baseline; gap: 8px; font-size: 1rem; }
  .user-profile .pp-group small { color: var(--text-muted); font-weight: 500; font-size: 0.8rem; }
  .user-profile .pp-explain { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px; font-size: 0.82rem; color: var(--text-muted); }
  .user-profile .pp-explain b { color: var(--text-main); }
  .pp-steps { display: flex; gap: 4px; padding: 10px 18px 0; }
  .pp-steps span { flex: 1; height: 4px; border-radius: 3px; background: var(--border-color); }
  .pp-steps span.is-on { background: var(--primary); }
  .pp-guide { padding: 14px 18px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .pp-guide h3 { margin: 0; font-size: 1.05rem; }
  .pp-guide > p { margin: -6px 0 0; color: var(--text-muted); font-size: 0.85rem; }
  .pp-grow { display: grid; grid-template-columns: auto minmax(0, 1.4fr) minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--border-color); }
  .pp-grow.is-done { opacity: .55; }
  .pp-grow b { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .pp-grow small { display: block; color: var(--text-muted); font-size: 0.75rem; }
  .pp-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .pp-cal span { text-align: center; font-size: 0.75rem; color: var(--text-muted); }
  .pp-cal button { min-height: 36px; border-radius: 9px; background: color-mix(in srgb, var(--text-main) 7%, var(--bg-card)); font-weight: 600; }
  .pp-cal button:disabled { opacity: .3; cursor: default; }
  .pp-cal button.is-on { background: var(--primary); color: #fff; }
  .pp-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pp-kpis div { background: color-mix(in srgb, var(--text-main) 6%, var(--bg-card)); border-radius: 12px; padding: 10px 12px; font-size: 0.8rem; color: var(--text-muted); }
  .pp-kpis b { display: block; font-size: 1.15rem; color: var(--text-main); font-variant-numeric: tabular-nums; }
  .pp-spark { width: 100%; height: 72px; }
  .pp-occ { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; }
  .pp-occ .pp-occ-amt { font-size: 1.6rem; font-weight: 750; color: var(--primary); font-variant-numeric: tabular-nums; }
  .pp-occ-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pp-occ-actions .qe-btn { justify-content: center; }
  .pp-toast { position: fixed !important; z-index: 2000; left: 50% !important; right: auto !important; bottom: 22px !important; transform: translateX(-50%) !important; max-width: min(560px, 92vw); }
  @media (min-width: 769px) { .pp-occ-dialog { max-width: 420px; } }
  .pp-noanim, .pp-noanim * { animation: none !important; transition: none !important; }
  .m-plans-link { display: flex; align-items: center; gap: 10px; margin: 12px 12px 0; }
  @media (max-width: 768px) {
    .pp-grow { grid-template-columns: auto minmax(0, 1fr) 96px; }
    .pp-grow > :last-child { grid-column: 2 / -1; }
    .pp-toast { bottom: 84px !important; }
    .day-planned-btns { max-width: none; justify-content: flex-start; width: 100%; }
    .user-profile .pp-explain { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
// =====================================================================================
// OUTER DEMO PAGE
// =====================================================================================
if (!window.IS_APP) {
  document.getElementById('app-css').remove();
  document.body.className = 'outer';
  document.getElementById('root').innerHTML = `
    <div class="wrap"><h1>Planned money · prototype</h1>
      <p class="lede">Built from the app's real stylesheets and components. Every future transaction is a <b>plan</b>, either money in or out, and either <b>sure</b> (rent, salary, bills) or an <b>estimate</b> (food, coffee, one-offs), and each one becomes a real transaction when its time passes. Nothing is saved; use <b>Reset</b> to start over.</p></div>
    <div class="bar"><div class="wrap">
      <div class="ctl">Frame <div class="seg" data-c="frame"><button data-v="desktop" class="on">Desktop</button><button data-v="phone">Phone</button></div></div>
      <div class="ctl">Plan entry <div class="seg" data-c="entry"><button data-v="tab" class="on">Visible “Plan” tab</button><button data-v="date">Decided by the date</button></div></div>
      <div class="ctl">Now <span class="clock" id="clock">Wed 4 Nov · 10:00</span>
        <button class="tb" data-t="60">+1 hour</button><button class="tb" data-t="1440">+1 day</button><button class="tb" data-t="10080">+1 week</button><button class="tb" data-t="reset">Reset</button></div>
      <div class="ctl" style="margin-left:auto">Theme <div class="seg" data-c="theme"><button data-v="light" class="on">Light</button><button data-v="dark">Dark</button></div></div>
    </div></div>
    <div class="wrap layout">
      <div class="stage" id="stage"><div class="desk" id="device"><div class="chrome"><i style="background:#f87171"></i><i style="background:#fbbf24"></i><i style="background:#34d399"></i><span>localhost:5173/calendar</span></div><iframe id="app" src="?app" title="MyFinance prototype"></iframe></div></div>
      <aside class="tips"><h3>Things to try</h3><ol>
        <li>Press <b>+1 day</b>: salary and rent (5 Nov), breakfast and lunch become real transactions.</li>
        <li>Press <b>+</b> in the header. Type an amount on the keypad and pick <b>Tomorrow</b>: it becomes a plan. Keep <b>Today</b> and it's recorded as real.</li>
        <li>Switch <b>Plan entry</b> to compare a visible <b>Plan</b> tab with “the date decides”.</li>
        <li>Click a future day → the day page shows its <b>Planned</b> items: Done, Change, Skip, Edit series.</li>
        <li><b>Plan your month</b> (calendar overview card) walks through income, bills, daily habits and one-offs.</li>
        <li>Open <b>Plans</b> in the navigation: one page for income, commitments and estimates.</li>
        <li>Switch to <b>Phone</b>: the real Month/Week screens, the dialog becomes a bottom sheet.</li>
      </ol><p>Styles are loaded live from <code>src/styles</code>, so this mockup always matches the current app design.</p></aside>
    </div>`;
  const frame = document.getElementById('app');
  const send = msg => frame.contentWindow.postMessage(msg, '*');
  document.addEventListener('click', e => {
    const b = e.target.closest('.seg button'); if (b) {
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      const c = b.parentElement.dataset.c, v = b.dataset.v;
      if (c === 'frame') {
        const dev = document.getElementById('device');
        dev.className = v === 'phone' ? 'phone' : 'desk';
        dev.querySelector('.chrome')?.style.setProperty('display', v === 'phone' ? 'none' : 'flex');
      }
      if (c === 'entry') send({ cmd: 'entry', v });
      if (c === 'theme') { send({ cmd: 'theme', v }); document.body.classList.toggle('dark', v === 'dark'); }
      return;
    }
    const t = e.target.closest('[data-t]'); if (t) send(t.dataset.t === 'reset' ? { cmd: 'reset' } : { cmd: 'time', min: +t.dataset.t });
  });
  window.addEventListener('message', e => { if (e.data?.cmd === 'clock') document.getElementById('clock').textContent = e.data.text; });
  return;
}

// =====================================================================================
// APP (inside the iframe)
// =====================================================================================
document.getElementById('outer-css').remove();
document.body.classList.add('light-mode');

// ---------- lucide icons (same set the app imports) ----------
const IP = {
  plus: 'M5 12h14M12 5v14', left: 'm15 18-6-6 6-6', right: 'm9 18 6-6-6-6', x: 'M18 6 6 18M6 6l12 12',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  list: 'M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13', chart: 'M3 3v16a2 2 0 0 0 2 2h16M18 17V9M13 17V5M8 17v-3',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
  range: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M3 10h18M8 2v4M17 14h-6M13 18H7M7 14h.01M17 18h.01"/>',
  refresh: 'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5',
  moon: 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-14.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  del: 'M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zM12 9l6 6M18 9l-6 6',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  Utensils: 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7',
  Car: '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2M9 17h6"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
  Film: '<rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>',
  ShoppingBag: 'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4ZM3 6h18M16 10a4 4 0 0 1-8 0',
  Receipt: 'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11',
  CircleDollarSign: '<circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 18V6"/>',
  Coffee: 'M10 2v2M14 2v2M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1M6 2v2',
  Home: 'M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  Heart: 'M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z',
  Briefcase: '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect x="2" y="6" width="20" height="14" rx="2"/>',
  Gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>',
  pencil: 'M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z',
  skip: 'M5 4l10 8-10 8zM19 5v14', undo: 'M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11',
  trash: 'M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2', check: 'M20 6 9 17l-5-5',
  sparkles: 'M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z',
  down: 'M12 5v14M19 12l-7 7-7-7', up: 'M12 19V5M5 12l7-7 7 7', settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
};
const ic = (n, s = 16) => { const p = IP[n] || IP.CircleDollarSign; return `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p.startsWith('<') ? p : `<path d="${p}"/>`}</svg>`; };

// ---------- helpers ----------
const DAY = 86400000;
const dn = s => Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / DAY);
const ds = n => new Date(n * DAY).toISOString().slice(0, 10);
const addDays = (s, n) => ds(dn(s) + n);
const dow = s => new Date(dn(s) * DAY).getUTCDay();
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

// ---------- plan engine (mirrors src/lib/plans.ts) ----------
function isPlanDate(p, d) {
  if (d < p.start || (p.end && d > p.end)) return false;
  const iv = Math.max(1, p.interval || 1), s = dn(p.start), x = dn(d);
  switch (p.freq) {
    case 'once': return x === s;
    case 'daily': return (x - s) % iv === 0;
    case 'weekdays': return dow(d) >= 1 && dow(d) <= 5;
    case 'weekly': { const days = p.days.length ? p.days : [dow(p.start)]; const mon = n => n - ((new Date(n * DAY).getUTCDay() + 6) % 7); return days.includes(dow(d)) && ((mon(x) - mon(s)) / 7) % iv === 0; }
    case 'monthly': { const months = (+d.slice(0, 4) - +p.start.slice(0, 4)) * 12 + (+d.slice(5, 7) - +p.start.slice(5, 7)); return months % iv === 0 && +d.slice(8) === Math.min(+p.start.slice(8), dim(+d.slice(0, 4), +d.slice(5, 7))); }
  }
  return false;
}
function occurrences(p, from, to, withSkipped = false) {
  const out = [], a = from > p.start ? from : p.start, b = p.end && p.end < to ? p.end : to;
  for (let x = dn(a); x <= dn(b); x++) {
    const d = ds(x); if (!isPlanDate(p, d)) continue;
    const e = p.ex[d]; if (e?.skip && !withSkipped) continue;
    out.push({ plan: p, date: d, time: p.time, amount: e?.amount || p.amount, name: e?.name || p.name, changed: !!e?.amount, skipped: !!e?.skip });
  }
  return out;
}
const realKeys = () => new Set(S.txs.filter(t => t.planId).map(t => t.planId + '|' + t.planDate));
function projected(from, to, withSkipped = false) {
  const keys = realKeys(), res = [];
  for (const p of S.plans) for (const o of occurrences(p, from, to, withSkipped)) {
    if (`${o.date}T${o.time}` <= p.mt || keys.has(p.id + '|' + o.date)) continue;
    res.push(o);
  }
  return res.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
function materialize() {
  const keys = realKeys(), made = [];
  for (const p of S.plans) {
    if (p.mt >= S.now) continue;
    for (const o of occurrences(p, p.mt.slice(0, 10), S.now.slice(0, 10))) {
      const st = `${o.date}T${o.time}`;
      if (st <= p.mt || st > S.now || keys.has(p.id + '|' + o.date)) continue;
      const tx = { id: nid(), kind: p.kind, name: o.name, amount: o.amount, cat: p.cat, date: o.date, time: o.time, planId: p.id, planDate: o.date };
      S.txs.push(tx); made.push(tx);
    }
    p.mt = S.now;
  }
  return made;
}
const monthRange = m => [`${m}-01`, `${m}-${String(dim(+m.slice(0, 4), +m.slice(5, 7))).padStart(2, '0')}`];
function monthSummary(m) {
  const [a, b] = monthRange(m), real = S.txs.filter(t => t.date >= a && t.date <= b), plan = projected(a, b);
  const r = {
    inReal: real.filter(t => t.kind === 'in').reduce((s, t) => s + t.amount, 0), outReal: real.filter(t => t.kind === 'out').reduce((s, t) => s + t.amount, 0),
    inPlan: plan.filter(o => o.plan.kind === 'in').reduce((s, o) => s + o.amount, 0), outPlan: plan.filter(o => o.plan.kind === 'out').reduce((s, o) => s + o.amount, 0),
  };

}

}

    <div class="m-strip">${days.map(d => `<button class="${d === sel ? 'is-on' : ''}${d === today ? ' is-today' : ''}${d > today ? ' is-future' : ''}" data-act="open-day" data-d="${d}"><small>${WD[dow(d)]}</small><b>${+d.slice(8)}</b></button>`).join('')}</div>

      let msg;
      if (st.isPlan) msg = savePlan(d);
      else { const income = d.mode === 'income'; S.txs.push({ id: nid(), kind: income ? 'in' : 'out', name: d.name.trim() || (income ? d.source : meta('out', d.cat).name), amount: amountOf(d), cat: income ? d.source : d.cat, date: d.date, time: d.time, planId: null, planDate: null }); msg = `Added ${d.name || (income ? d.source : meta('out', d.cat).name)}: ${income ? '+' : '−'}${k(amountOf(d))} ₫.`; }
      toast(msg);
      if (el.dataset.next) S.dialog = { ...newDraft({ date: d.date }), plan: d.plan, mode: d.mode, cat: d.cat, source: d.source, repeat: d.repeat, freq: d.freq, days: d.days, time: d.time };
      else { S.dialog = null; S.month = d.date.slice(0, 7); }
      break;
    }
    case 'deltx': S.txs = S.txs.filter(t => t.id !== el.dataset.id); toast('Deleted. If it came from a plan, it won’t come back.'); break;
    case 'change': S.changing = el.dataset.key; break;
    case 'change-cancel': S.changing = null; break;
    case 'occ-open': S.occ = { p: el.dataset.p, d: el.dataset.d }; S.changing = null; break;
    case 'occ-skip': plan(el.dataset.p).ex[el.dataset.d] = { skip: true }; S.occ = null; toast('Skipped for this day.'); break;
    case 'occ-unskip': delete plan(el.dataset.p).ex[el.dataset.d]; toast('Planned again for this day.'); break;
    case 'occ-usual': delete plan(el.dataset.p).ex[el.dataset.d]; S.occ = null; toast('Back to the usual amount.'); break;
    case 'occ-done': {
      const p = plan(el.dataset.p), date = el.dataset.d, o = occurrences(p, date, date)[0], today = S.now.slice(0, 10);
      S.txs.push({ id: nid(), kind: p.kind, name: o.name, amount: o.amount, cat: p.cat, date: date <= today ? date : today, time: date < today ? o.time : S.now.slice(11), planId: p.id, planDate: date });
      S.occ = null; toast(`${o.name} recorded as real now. The plan for ${nice(date)} is fulfilled.`); break;
    }
    case 'occ-series': { const p = plan(el.dataset.p), draft = draftFromPlan(p); if (p.freq !== 'once' && el.dataset.d > p.start) draft.applyFrom = el.dataset.d; S.occ = null; S.dialog = draft; break; }
    case 'edit': S.dialog = draftFromPlan(plan(el.dataset.p)); break;
    case 'delplan': { const p = plan(el.dataset.p); if (!confirm(`Delete “${p.name}”? Upcoming planned days disappear; past transactions are kept.`)) return; S.plans = S.plans.filter(x => x !== p); S.txs.forEach(t => { if (t.planId === p.id) t.planId = null; }); S.dialog = null; toast(`Deleted ${p.name}. Its past transactions are kept.`); break; }
    case 'guide': S.guide = newGuide(); S.dialog = S.occ = null; break;
    case 'g-toggle': { const it = S.guide[el.dataset.k][+el.dataset.i]; if (!it.done) it.on = !it.on; break; }
    case 'g-next': S.guide.step++; break;
    case 'g-back': S.guide.step--; break;
    case 'g-date': { const g = S.guide, i = g.oneoffs.findIndex(o => o.date === el.dataset.d); if (i >= 0) g.oneoffs.splice(i, 1); else g.oneoffs.push({ date: el.dataset.d, name: '', amount: '' }); g.oneoffs.sort((x, y) => x.date.localeCompare(y.date)); break; }
    case 'g-rm': S.guide.oneoffs.splice(+el.dataset.i, 1); break;
    case 'g-finish': { const ps = guidePlans(S.guide); S.plans.push(...ps); S.guide = null; S.page = 'calendar'; toast(ps.length ? `Created ${ps.length} plans. The calendar now shows your whole month.` : 'Nothing new to create.'); break; }
    default: return;
  }
  render();
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  if (el.dataset.act === 'close-bg' && e.target.closest('[data-stop]')) return;
  act(el.dataset.act, el);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="change"]'); if (!f) return;
  e.preventDefault();
  const v = Math.round(+String(f.amount.value).replace(/[^\d]/g, ''));
  if (!(v > 0)) { toast('Enter an amount above 0 ₫'); render(); return; }
  const p = plan(f.dataset.p); p.ex[f.dataset.d] = { ...(p.ex[f.dataset.d] || {}), amount: v, skip: false };
  S.changing = null; S.occ = null; toast(`${p.name} on ${nice(f.dataset.d)} is now ${k(v)} ₫.`); render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.dialog) {
    S.dialog[t.dataset.f] = t.value;
    if (t.dataset.f === 'query') { const pos = t.selectionStart; render(); const q = document.querySelector('[data-f="query"]'); q.focus(); q.setSelectionRange(pos, pos); return; }
    const s = document.getElementById('pp-status'); if (s) s.innerHTML = statusHtml(S.dialog);
    const b = document.getElementById('pp-save'); if (b) b.textContent = saveLabel(S.dialog);
  }
  if (t.dataset.g && S.guide) { const [key, i, f] = t.dataset.g.split(':'); S.guide[key][+i][f] = f === 'amount' ? t.value.replace(/[^\d]/g, '') : t.value; }
});
document.addEventListener('change', e => { if (e.target.dataset.re !== undefined && S.dialog) render(); });
// Keypad from the hardware keyboard while the dialog is open (as in the app).
document.addEventListener('keydown', e => {
  if (!S.dialog) { if (e.key === 'Escape') { S.guide = S.occ = null; render(); } return; }
  const inField = e.target.closest?.('input, select, textarea');
  if (e.key === 'Escape') { if (inField) e.target.blur(); else { S.dialog = null; render(); } return; }
  if (e.key === 'Enter' && !inField) { e.preventDefault(); act('save', { dataset: {} }); return; }
  if (inField || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^\d$/.test(e.key)) act('key', { dataset: { v: e.key } });
  else if (e.key === 'k' || e.key === 'K') act('key', { dataset: { v: '000' } });
  else if (e.key === 'Backspace') act('key', { dataset: { v: 'del' } });
});
// Messages from the demo toolbar.
window.addEventListener('message', e => {
  const m = e.data || {};
  if (m.cmd === 'time') {
    S.now = addMinutes(S.now, m.min); const made = materialize();
    S.day = S.now.slice(0, 10); S.month = S.now.slice(0, 7);
    toast(made.length ? `${made.length} planned item${made.length > 1 ? 's' : ''} became real: ${made.slice(0, 4).map(t => `${t.name} ${t.kind === 'in' ? '+' : ''}${k(t.amount)}`).join(', ')}${made.length > 4 ? '…' : ''}` : 'Nothing planned in that time.');
  }
  if (m.cmd === 'reset') { Object.assign(S, seed(), { page: 'calendar', month: '2026-11', day: '2026-11-04', dialog: null, guide: null, occ: null, changing: null }); toast('Reset to Wed 4 Nov, 10:00.'); }
  if (m.cmd === 'entry') { S.entry = m.v; if (S.dialog && m.v === 'date') S.dialog.plan = false; }
  if (m.cmd === 'theme') S.theme = m.v;
  render();
});
matchMedia('(max-width: 768px)').addEventListener('change', () => { if (isMobile() && S.page === 'day') S.page = 'week'; if (!isMobile() && S.page === 'week') S.page = 'day'; render(); });
render();
})();
</script>

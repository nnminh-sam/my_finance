<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · Tracker</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f6fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
      main { max-width: 34rem; padding: clamp(1.5rem, 5vw, 3rem); border: 1px solid #dce2ef; border-radius: 1.5rem; background: #fff; }
      .code { margin: 0; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.15em; color: #4653a8; }
      h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.15; }
      p { line-height: 1.65; }
      a { display: inline-block; margin-top: 0.75rem; padding: 0.75rem 1.25rem; border-radius: 0.75rem; background: #3545a3; color: #fff; font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
      a:focus-visible { outline: 3px solid #6979dc; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) {
        :root { color: #e7ebf5; background: #111624; }
        main { background: #1a2233; border-color: #35415a; }
        .code { color: #aeb9ff; }
        a { background: #b2beff; color: #111624; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · TRACKER</p>
      <h1>This page couldn’t be found.</h1>
      <p>The link may be outdated, or the address may have a typo. Head back home to continue tracking your finances.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
